<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tradutor de Reuniões</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        h2 { margin-top: 10px; color: #333; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button { padding: 18px; font-size: 18px; cursor: pointer; border-radius: 12px; border: none; font-weight: bold; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btnIniciar { background-color: #4CAF50; color: white; }
        #btnParar { background-color: #f44336; color: white; }
        button:disabled { background-color: #cccccc; color: #666666; box-shadow: none; }
        .log { font-size: 16px; text-align: left; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 50vh; overflow-y: auto; border: 1px solid #e0e0e0; }
        .eng { color: #666; font-style: italic; font-size: 0.9em; margin-bottom: 5px; }
        .pt { color: #1565c0; font-weight: bold; margin-bottom: 20px; border-left: 3px solid #1565c0; padding-left: 10px; }
        #status { font-weight: 500; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Tradutor Simultâneo</h2>
    <div id="status">Pronto para iniciar</div>
    
    <div class="controls">
        <button id="btnIniciar">▶ Iniciar Reunião (Inglês)</button>
        <button id="btnParar" disabled>⏹ Parar Reunião</button>
    </div>
    
    <div class="log" id="logTextos"></div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

        let ws;
        let recognition;
        let escutando = false;
        let pausadoParaFalar = false;
        
        const btnIniciar = document.getElementById('btnIniciar');
        const btnParar = document.getElementById('btnParar');
        const statusDiv = document.getElementById('status');
        const logTextos = document.getElementById('logTextos');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Por favor, use o navegador Google Chrome.");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                if (pausadoParaFalar) return;
                let fraseFinal = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) fraseFinal += event.results[i][0].transcript;
                }
                if (fraseFinal.trim() !== "") {
                    statusDiv.innerText = "Processando tradução...";
                    logTextos.innerHTML += `<div class="eng">🇺🇸 ${fraseFinal}</div>`;
                    logTextos.scrollTop = logTextos.scrollHeight; 
                    ws.send(fraseFinal);
                }
            };

            recognition.onend = () => {
                if (escutando && !pausadoParaFalar) recognition.start();
            };
        }

        btnIniciar.onclick = () => {
            // Truque para destravar o áudio no celular (toca um áudio vazio rápido)
            const unlockAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
            unlockAudio.play().catch(() => {});

            const protocoloWS = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocoloWS + window.location.host + "/ws");
            
            ws.onopen = () => {
                escutando = true;
                pausadoParaFalar = false;
                statusDiv.innerText = "🎙️ Escutando a reunião...";
                recognition.start();
                btnIniciar.disabled = true;
                btnParar.disabled = false;
            };

         // Substitua a função ws.onmessage no seu index.html por esta:
ws.onmessage = (event) => {
    // 1. Recebe os dados
    const dados = JSON.parse(event.data);
    
    // 2. Toca o áudio
    const snd = new Audio("data:audio/mp3;base64," + dados.audio);
    
    // 3. Garante que, ao terminar o áudio, a escuta reinicie SEMPRE
    snd.onended = () => {
        statusDiv.innerText = "🎙️ Escutando a reunião...";
        pausadoParaFalar = false;
        recognition.start(); // Força a reativação do microfone
    };
    
    snd.play();
    logTextos.innerHTML += `<div class="pt">🇧🇷 ${dados.texto}</div>`;
    logTextos.scrollTop = logTextos.scrollHeight;
};
                
                // Escreve a tradução real na tela
                logTextos.innerHTML += `<div class="pt">🇧🇷 ${dados.texto}</div>`;
                logTextos.scrollTop = logTextos.scrollHeight;
                
                snd.onended = () => {
                    if (escutando) {
                        pausadoParaFalar = false;
                        statusDiv.innerText = "🎙️ Escutando a reunião...";
                        recognition.start();
                    }
                };
            };
        };

        btnParar.onclick = () => {
            escutando = false;
            if (recognition) recognition.stop();
            if (ws) ws.close();
            statusDiv.innerText = "Sistema Parado.";
            btnIniciar.disabled = false;
            btnParar.disabled = true;
        };
    </script>
</body>
</html>
